name: Build WearTube APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Le SDK Android est déjà préinstallé sur ubuntu-latest.
      # android-actions/setup-android@v3 essayait d'installer le paquet obsolète
      # "tools", qui n'existe plus avec cmdline-tools 16 -> on l'évite.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" || true
          "$SDKMANAGER" --install "platforms;android-37.1" || true
          "$SDKMANAGER" --install "platforms;android-37" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # build.gradle.kts attend weartube.keystore (alias weartube, mots de passe android).
      # Si le secret RELEASE_KEYSTORE_BASE64 existe, on l'utilise ; sinon on génère
      # un keystore temporaire (les mises à jour ne s'installeront alors pas par-dessus).
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > weartube.keystore
            echo "Keystore loaded from secrets."
          else
            keytool -genkeypair -v -keystore weartube.keystore \
              -storepass android -keypass android -alias weartube \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=WearTube CI"
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret: using a temporary keystore."
          fi

      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Check APKs exist
        run: |
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1)
          if [ -z "$DEBUG_APK" ] || [ -z "$RELEASE_APK" ]; then
            echo "::error::APK not found"
            ls -R app/build/outputs || true
            exit 1
          fi
          mkdir -p dist
          cp "$RELEASE_APK" dist/YouTube-WearOS.apk
          cp "$DEBUG_APK" dist/YouTube-WearOS-debug.apk
          ls -lh dist

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-WearOS.apk
          path: dist/YouTube-WearOS.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-WearOS-debug.apk
          path: dist/YouTube-WearOS-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YouTube-WearOS.apk
            dist/YouTube-WearOS-debug.apk
